name: React diagnostics and runtime checks

on:
  pull_request:
    branches: [master]
    # The docs site is the repository root; agent tooling and unrelated scripts are left out.
    paths:
      [
        "**",
        "!.agents/**",
        "!.claude/**",
        "!.codex/**",
        "!.github/**",
        "!scripts/**",
        "scripts/react-perf/**",
        "scripts/__tests__/docs-client-state.node-test.mjs",
        "scripts/__tests__/hook-runner.mjs",
        "scripts/pw-session.sh",
        ".github/workflows/react-checks.yml",
      ]
  push:
    branches: [master]
    paths:
      [
        "**",
        "!.agents/**",
        "!.claude/**",
        "!.codex/**",
        "!.github/**",
        "!scripts/**",
        "scripts/react-perf/**",
        "scripts/__tests__/docs-client-state.node-test.mjs",
        "scripts/__tests__/hook-runner.mjs",
        "scripts/pw-session.sh",
        ".github/workflows/react-checks.yml",
      ]

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Pushes to a branch never cancel each other.
concurrency:
  group: react-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  react:
    env:
      PERF_BASE: ${{ (github.event.pull_request.base.sha || github.event.before) != '0000000000000000000000000000000000000000' && (github.event.pull_request.base.sha || github.event.before) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Verify docs client language and search state
        run: node --test scripts/__tests__/docs-client-state.node-test.mjs
      - run: corepack yarn doctor:check
      # Hosted images disable Chrome updates between image releases.
      - run: corepack yarn perf:install --force
      # Hosted runners are roughly 2.5x slower than the developer hardware the
      # wall-clock budgets were calibrated on. Commit and component-update
      # budgets are hardware independent and stay exact.
      - run: corepack yarn perf:check --output .react-perf/ci
        env:
          REACT_PERF_TIME_SCALE: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-performance-evidence
          path: .react-perf/
          # The evidence directory is itself hidden, so the default exclusion
          # dropped every report and trace this step exists to preserve.
          include-hidden-files: true
          if-no-files-found: ignore
